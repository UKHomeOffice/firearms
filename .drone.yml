---
kind: pipeline
name: default
type: kubernetes

environment:
  APP_NAME: firearms-licensing
  PROD_ENV: firearms
  STG_ENV: firearms-stg
  UAT_ENV: firearms-dev
  BRANCH_ENV: firearms-branch
  PRODUCTION_URL: www.firearms-licensing.homeoffice.gov.uk
  IMAGE_REPO: sas/firearms-licensing
  IMAGE_URL : 340268328991.dkr.ecr.eu-west-2.amazonaws.com
  GIT_REPO: UKHomeOffice/firearms
  HOF_CONFIG: hof-services-config/Firearms_Licensing
  NON_PROD_AVAILABILITY: Mon-Fri 08:00-23:00 Europe/London
  READY_FOR_TEST_DELAY: 20s
  NOTIFY_STUB: stub

include_default_branch: &include_default_branch
  include:
    - master

include_default_and_feature_branches: &include_default_and_feature_branches
  include:
    - master
    - feature/*
    - deps-*
    - deps/*

trigger:
  branch:
    - feature/*
    - master
    - deps-*
    - deps/*

node_image: &node_image
  pull: if-not-exists
  image: &node_image_name quay.io/ukhomeofficedigital/hof-nodejs:24.22.2_3-alpine@sha256:ebf742568d6fa9505e5b8740dbb6bf7f4d38ea3a22fc2a940ee57cfa3a95a41e


linting: &linting
  <<: *node_image
  commands:
    - yarn run test:lint

unit_tests: &unit_tests
  <<: *node_image
  environment:
    NOTIFY_KEY: USE_MOCK
  commands:
    - yarn run test:unit

sonar_scanner: &sonar_scanner
  pull: if-not-exists
  image: quay.io/ukhomeofficedigital/sonar-scanner:latest
  commands:
    - sonar-scanner -Dproject.settings=./sonar-project.properties

github_app_token_step: &github_app_token_step
  <<: *node_image
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - apk add --no-cache bash curl jq openssl
    - bash bin/generate_github_app_token.sh

github_app_token_secrets_ukho: &github_app_token_secrets_ukho
  GITHUB_APP_ID:
    from_secret: hof_ukho_gh_app_id
  GITHUB_APP_PRIVATE_KEY:
    from_secret: hof_ukho_gh_app_pk
  GITHUB_APP_INSTALLATION_ID:
    from_secret: hof_ukho_gh_app_install_id

github_app_token_secrets_hof: &github_app_token_secrets_hof
  GITHUB_APP_ID:
    from_secret: HOF_GH_APP_ID
  GITHUB_APP_PRIVATE_KEY:
    from_secret: HOF_GH_APP_PK
  GITHUB_APP_INSTALLATION_ID:
    from_secret: HOF_GH_APP_INSTALL_ID

clone_repos_step: &clone_repos_step
  image: alpine/git
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - |
      set -eu
      test -s "$${CLONE_TOKEN_FILE}" || { echo "Missing GitHub App clone token file"; exit 1; }
      trap 'rm -f "$${CLONE_TOKEN_FILE}"' EXIT
      GITHUB_TOKEN="$(cat "$${CLONE_TOKEN_FILE}")"
      git clone "https://x-access-token:$${GITHUB_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git"
      git -C hof-services-config remote set-url origin https://github.com/UKHomeOfficeForms/hof-services-config.git
      unset GITHUB_TOKEN
      if [ "$${CLONE_REPOS_PRUNE:-false}" = "true" ]; then
        find hof-services-config/* | grep -v "$${HOF_CONFIG}" | grep -v 'infrastructure' | xargs rm -rf
      fi

steps:
  - name: generate_github_app_token_for_clone
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
      CLONE_REPOS_PRUNE: "true"
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - generate_github_app_token_for_clone

  # Trivy Security Scannner for scanning OS related vulnerabilities in Base image of Dockerfile
  - name: scan_base_image_os
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: *node_image_name
      SEVERITY: MEDIUM,HIGH,CRITICAL  --dependency-tree --format table
      SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request]
    depends_on:
      - clone_repos 

  - name: setup
    <<: *node_image
    environment:
      NOTIFY_KEY: USE_MOCK
    commands:
      - yarn install --frozen-lockfile
      - yarn run postinstall
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: linting
    <<: *linting
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: unit_tests
    <<: *unit_tests
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: sonar_scanner
    <<: *sonar_scanner
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
  
  - name: build_image_for_trivy
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      # wait for docker service to be up before running docker build
      - /usr/local/bin/wait
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      branch: master
      event: [push, pull_request]
    depends_on:
      - linting
      - unit_tests

  - name: build_image_and_push_to_ecr
    pull: if-not-exists
    image: plugins/ecr
    settings:
      access_key:
        from_secret: AWS_ACCESS_KEY_ID
      secret_key:
        from_secret: AWS_SECRET_ACCESS_KEY
      region: eu-west-2
      repo: sas/firearms-licensing
      registry: 340268328991.dkr.ecr.eu-west-2.amazonaws.com
      tags:
        - ${DRONE_COMMIT_SHA}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - build_image_for_trivy

  # Trivy Security Scannner for scanning nodejs packages in Yarn
  - name: scan_node_packages
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: "sas/firearms-licensing:${DRONE_COMMIT_SHA}"
      SEVERITY: MEDIUM,HIGH,CRITICAL  --dependency-tree --format table
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request]
    depends_on:
      - build_image_for_trivy
      - clone_repos

  # Deploy to pull request UAT environment
  - name: deploy_to_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      # NOTIFY_STUB: stub
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_sas_dev
      REDIS_PERSISTENCE_ENABLED: "false"
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh $${BRANCH_ENV}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - clone_repos
      - build_image_and_push_to_ecr

  - name: e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    environment:
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - npm install -g n
      - n 24.22.1
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - test -s /root/.dockersock/branch_url.txt || (echo "Missing deployed branch URL at /root/.dockersock/branch_url.txt" && exit 1)
      - echo "Running Playwright e2e against https://$(cat /root/.dockersock/branch_url.txt)"
      - CI=true PLAYWRIGHT_BASE_URL="https://$(cat /root/.dockersock/branch_url.txt)" yarn test:e2e
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - deploy_to_branch

  - name: generate_github_app_token
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_ukho
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status: [success, failure]
    depends_on:
      - e2e_tests

  - name: publish_e2e_report_to_pr
    <<: *node_image
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache bash curl jq zip
      - |
        set -eu
        token_file=/root/.dockersock/github_app_token.txt
        trap 'rm -f "$${token_file}"' EXIT
        test -s "$${token_file}" || { echo "Missing GitHub App report token file"; exit 1; }
        export GITHUB_APP_TOKEN="$(cat "$${token_file}")"
        export DRONE_REPO="$${DRONE_REPO:-$GIT_REPO}"
        bash bin/publish_e2e_test_report.sh
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status: [success, failure]
    depends_on:
      - generate_github_app_token

  # Deploy to Master UAT environment
  - name: deploy_to_uat
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_dev
      REDIS_PERSISTENCE_ENABLED: "false"
    commands:
      - bin/deploy.sh $${UAT_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - clone_repos
      - build_image_and_push_to_ecr

  # Get pull request branch so correct PR UAT environment is torn down in the tear_down_branch step that follows
  - name: get_pr_branch
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: drone_server
      DRONE_TOKEN:
        from_secret: drone_token
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - drone build info $GIT_REPO $DRONE_BUILD_NUMBER --format {{.Message}} | grep -o '[^ ]\+$' -m1 | sed 's|UKHomeOffice/||g' | tr '[:upper:]' '[:lower:]' | tr '/' '-' > /root/.dockersock/branch_name.txt
    when:
      branch:
        <<: *include_default_branch
      event: push

  # Tear down pull request UAT environment
  - name: tear_down_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_sas_dev
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh tear_down
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - get_pr_branch
      - deploy_to_uat

  # Deploy to Staging environment
  - name: deploy_to_stg
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_stg
      KUBE_TOKEN:
        from_secret: kube_token_stg
      REDIS_PERSISTENCE_ENABLED: "true"
      REDIS_PERSISTENCE_SIZE: "1Gi"
    commands:
      - bin/deploy.sh $${STG_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - clone_repos
      - build_image_and_push_to_ecr
      - deploy_to_branch

  # Checks a build being promoted has passed, is on master which effectively means a healthy build on Staging
  - name: sanity_check_build_prod
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: drone_server
      DRONE_TOKEN:
        from_secret: drone_token
    commands:
      - bin/sanity_check_build.sh
    when:
      target: PROD
      event: promote

  - name: generate_github_app_token_for_clone_prod
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
    when:
      target: PROD
      event: promote
    depends_on:
      - sanity_check_build_prod

  - name: clone_repos_prod
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
    when:
      target: PROD
      event: promote
    depends_on:
      - generate_github_app_token_for_clone_prod

    # Deploy to Production environment
  - name: deploy_to_prod
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_prod
      KUBE_TOKEN:
        from_secret: kube_token_prod
      REDIS_PERSISTENCE_ENABLED: "true"
      REDIS_PERSISTENCE_SIZE: "10Gi"
    commands:
      - bin/deploy.sh $${PROD_ENV}
    when:
      target: PROD
      event: promote
    depends_on:
      - clone_repos_prod

# CRON job step that tears down our pull request UAT environments
  - name: cron_tear_down
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_sas_dev
    commands:
      - bin/clean_up.sh $${BRANCH_ENV}
    when:
      cron: tear_down_pr_envs
      event: cron

  # CRON job steps that runs security scans using Snyk & Trivy
  - name: generate_github_app_token_for_clone_cron
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
    when:
      cron: security_scans
      event: cron

  - name: cron_clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
      CLONE_REPOS_PRUNE: "true"
    when:
      cron: security_scans
      event: cron
    depends_on:
      - generate_github_app_token_for_clone_cron

  - name: cron_build_image_for_trivy
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      # wait for docker service to be up before running docker build
      - /usr/local/bin/wait
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      cron: security_scans
      event: cron

  - name: cron_trivy_scan_image_os
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
        IMAGE_NAME: *node_image_name
        SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --dependency-tree --format table
        FAIL_ON_DETECTION: true
        IGNORE_UNFIXED: false
        ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan_node_packages
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
      IMAGE_NAME: "sas/firearms-licensing:${DRONE_COMMIT_SHA}"
      SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --dependency-tree --format table
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
      status:
        - success
        - failure
    depends_on:
      - cron_build_image_for_trivy
      - cron_clone_repos

  # Slack notification upon a CRON job fail
  - name: cron_notify_slack_tear_down_pr_envs
    pull: if-not-exists
    image: plugins/slack:1.4.1
    settings:
      channel: sas-hof-build-notify
      failure: ignore
      template: >
            *✘ {{ uppercasefirst build.status }}*: CRON Job `tear_down_pr_envs` for *FIREARMS LICENSING* has failed.

            Branch <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{build.branch}}> | Commit <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>

            *Build <{{build.link}}|#{{build.number}}>*
      username: Drone_CI
      webhook:
        from_secret: slack_sas_hof_build_notify_webhook
    when:
      cron: tear_down_pr_envs
      event: cron
      status:
        - failure
    depends_on:
      - cron_tear_down

  - name: cron_notify_slack_security_scans
    pull: if-not-exists
    image: plugins/slack:1.4.1
    settings:
      channel: sas-hof-security
      failure: ignore
      template: >
            *✘ {{ uppercasefirst build.status }}*: CRON Job `security_scans` for *FIREARMS LICENSING* has failed.

            Branch <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{build.branch}}> | Commit <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>

            *Build <{{build.link}}|#{{build.number}}>*
      username: Drone_CI
      webhook:
        from_secret: slack_sas_hof_security_webhook
    when:
      cron: security_scans
      event: cron
      status:
        - failure
    depends_on:
      - cron_trivy_scan_image_os
      - cron_trivy_scan_node_packages

  - name: cron_nightly_e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    environment:
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - npm install -g n
      - n 24.22.1
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - |
        bash -c '
          set -eu
          : "$${NIGHTLY_E2E_BASE_URL:?Missing NIGHTLY_E2E_BASE_URL}"
          output=/root/.dockersock/nightly-playwright-output.txt
          summary=/root/.dockersock/nightly-playwright-summary.txt
          set +e
          CI=true PLAYWRIGHT_BASE_URL="$${NIGHTLY_E2E_BASE_URL}" yarn test:e2e > "$${output}" 2>&1
          test_status=$?
          set -e
          tail -n 60 "$${output}"
          node bin/summarise_playwright_report.js "$${output}" "$${summary}"
          exit "$${test_status}"
        '
    when:
      cron: nightly_e2e_playwright
      event: cron

  - name: cron_notify_slack_nightly_e2e
    <<: *node_image
    environment:
      SLACK_WEBHOOK:
        from_secret: slack_sas_hof_e2e_tests_webhook
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache curl jq
      - |
        set -eu
        : "$${SLACK_WEBHOOK:?Missing Slack webhook secret}"
        summary=/root/.dockersock/nightly-playwright-summary.txt
        if [ ! -s "$${summary}" ]; then
          echo "Nightly summary missing: test setup or execution failed."
          printf 'Playwright Nightly Summary\nSummary unavailable: test setup or execution failed.\n' > "$${summary}"
        fi
        payload=$(jq -n \
          --arg repo "$${DRONE_REPO}" \
          --arg status "$${DRONE_BUILD_STATUS}" \
          --arg branch "$${DRONE_BRANCH}" \
          --arg url "$${NIGHTLY_E2E_BASE_URL}" \
          --arg link "$${DRONE_BUILD_LINK}" \
          --rawfile summary "$${summary}" \
          '{text: ("Nightly Playwright: " + $repo + "\nStatus: " + $status + "\nBranch: " + $branch + "\nEnvironment: " + $url + "\nBuild: " + $link + "\n" + $summary)}')
        response=$(curl --fail-with-body -sS -H 'Content-Type: application/json' --data "$${payload}" "$${SLACK_WEBHOOK}")
        test "$${response}" = "ok" || { echo "Slack rejected nightly notification: $${response}"; exit 1; }
    when:
      cron: nightly_e2e_playwright
      event: cron
      status: [success, failure]
    depends_on:
      - cron_nightly_e2e_tests

services:
  - name: docker
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind

  # Redis session setup in background so integration tests can run
  - name: session
    image: redis
    volumes:
      - name: dockersock
        path: /var/run

volumes:
  - name: dockersock
    temp: {}

...
