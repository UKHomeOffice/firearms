---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{ if eq .KUBE_NAMESPACE .BRANCH_ENV }}
  name: redis-{{ .DRONE_SOURCE_BRANCH }}
  {{ else }}
  name: redis
  {{ end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{ if eq .KUBE_NAMESPACE .BRANCH_ENV }}
      app: redis-{{ .DRONE_SOURCE_BRANCH }}
      {{ else }}
      app: redis
      {{ end }}
  template:
    metadata:
      labels:
        {{ if eq .KUBE_NAMESPACE .BRANCH_ENV }}
        name: redis-{{ .DRONE_SOURCE_BRANCH }}
        service: redis-{{ .DRONE_SOURCE_BRANCH }}
        app: redis-{{ .DRONE_SOURCE_BRANCH }}
        {{ else }}
        name: redis
        service: redis
        app: redis
        {{ end }}
    spec:
      containers:
        - name: redis
          # redis:v7.0.15
          image: quay.io/ukhomeofficedigital/hof-docker-redis:7.0.15@sha256:cd4965fbb8aa6e4eba058985cc52f6a3ececdfa6d79ba44206f051f72a1f0611
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            - --dir
            - /data
            - --protected-mode
            - "no"
          ports:
            - containerPort: 6379
          volumeMounts:
            - mountPath: /data
              name: data
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "20m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "200Mi"
      volumes:
        - name: data
          {{ if eq .REDIS_PERSISTENCE_ENABLED "true" }}
          {{ if eq .REDIS_PERSISTENCE_EXISTING_CLAIM "" }}
          persistentVolumeClaim:
            claimName: redis-data
          {{ else }}
          persistentVolumeClaim:
            claimName: {{ .REDIS_PERSISTENCE_EXISTING_CLAIM }}
          {{ end }}
          {{ else }}
          emptyDir: {}
          {{ end }}
